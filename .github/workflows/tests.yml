name: Tests Laravel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Copier le fichier .env
        run: cp .env.example .env

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Générer la clé d'application
        run: php artisan key:generate

      - name: Créer la base SQLite en mémoire pour les tests
        run: |
          php artisan config:clear

      - name: Lancer les tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
        run: php artisan test
